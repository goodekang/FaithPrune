[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "faithprune"
version = "1.0.0"
description = "FaithPrune: hallucination-aware visual token pruning for efficient and faithful MLLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "transformers==4.51.3",
  "accelerate>=0.30",
  "pillow>=10.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "nltk>=3.8",
]

[project.optional-dependencies]
eval = ["lmms-eval>=0.3", "spacy>=3.7", "qwen-vl-utils>=0.0.8"]
flash = ["flash-attn>=2.5"]

[tool.setuptools.packages.find]
include = ["faithprune*"]
