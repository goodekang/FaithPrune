# CHAIR on the 500 COCO val2014 images released with the CMAC code
# (identical to the OPERA list), LLaVA-1.5 conversation template, greedy
# decoding, 512-token limit, original CHAIR synonym list.
decoding:
  strategy: greedy
  max_new_tokens: 512

eval:
  benchmark: chair
  extra:
    image_dir: data/coco/val2014
    image_list: data/chair/chair_500_images.txt
    prompt: "Please describe this image in detail."
    synonyms_file: data/chair/synonyms.txt
    instances_file: data/coco/annotations/instances_val2014.json
    captions_file: data/coco/annotations/captions_val2014.json
